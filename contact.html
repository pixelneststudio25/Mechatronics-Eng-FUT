<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mechatronics Engineering, FUT Minna</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">...</nav>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Contact Us</h1>
            </div>
        </section>

        <section class="contact-info">
            <div class="container">
                <div class="contact-details">
                    <p><i class="fas fa-map-marker-alt"></i> Department of Mechatronics Engineering, FUT Minna, Niger State</p>
                    <p><i class="fas fa-phone"></i> +234 123 456 7890</p>
                    <p><i class="fas fa-envelope"></i> mechatronics@futminna.edu.ng</p>
                </div>
            </div>
        </section>

        <section class="contact-form-section">
            <div class="container">
                <h2>Send a Message</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="level">Level</label>
                        <select id="level" name="level" required>
                            <option value="">Select Level</option>
                            <option value="100">100 Level</option>
                            <option value="200">200 Level</option>
                            <option value="300">300 Level</option>
                            <option value="400">400 Level</option>
                            <option value="500">500 Level</option>
                            <option value="staff">Staff</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="matric">Matric Number (if student)</label>
                        <input type="text" id="matric" name="matric">
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
                <div id="form-feedback"></div>
            </div>
        </section>
    </main>

    <footer>...</footer>
    <script src="js/script.js"></script>
</body>
</html>
